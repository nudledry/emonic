name: emonic
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.16.0
  cloud_firestore: ^4.9.1

  # State Management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Local Package
  user_repository:
    path: packages/user_repository

  # Utilities
  intl: ^0.18.0
  cached_network_image: ^3.2.3
  url_launcher: ^6.1.12
  firebase_auth: ^4.16.0
  sqflite: ^2.4.2
  fl_chart: ^1.0.0
  provider: ^6.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
